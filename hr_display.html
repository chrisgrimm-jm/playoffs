<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Home Run Banner — Display (build 2026-09-25f)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue:ital@0;1&family=Sofia+Sans+Semi+Condensed:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
body{font-family:'Sofia Sans Semi Condensed',sans-serif;}

/* Full 1920x1080 transparent canvas, self-scaling to the OBS source / window --
   same trick as the odds Display, so the Control preview matches OBS exactly. */
#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:hidden;transform-origin:top left;}

/* ── Style A: BAR — the banner at the top of screen, slides down/up. Same
   864x119 footprint as the moneyline bar, mirrored to the top edge. ── */
.hbar{position:absolute;width:864px;height:119px;overflow:hidden;border-radius:6px;
  transform:translateY(-160%);transition:transform .5s cubic-bezier(.16,1,.3,1);}
.hbar.show{transform:translateY(0);}
/* same stadium art as the odds ticker (logo baked in, so no separate logo img);
   text drops into the same band the moneyline uses. */
.hbar .art{position:absolute;inset:0;width:100%;height:100%;display:block;}
.hrwrap{position:absolute;left:15.6%;width:81.8%;top:7.8%;height:69.9%;
  display:flex;align-items:center;gap:18px;padding:0 6px;overflow:hidden;}
.hrhead{font-family:'Bebas Neue',sans-serif;font-style:italic;font-size:58px;
  letter-spacing:1px;color:#F1FD0E;line-height:1;white-space:nowrap;flex:0 0 auto;}
.hrvp{position:relative;flex:1 1 auto;height:100%;overflow:hidden;}
.hrtrack{position:absolute;top:0;left:0;height:100%;white-space:nowrap;will-change:transform;}
.item{display:inline-flex;align-items:center;height:100%;
  font-family:'Sofia Sans Semi Condensed',sans-serif;font-weight:700;
  font-size:57px;letter-spacing:.4px;color:#FAFAFA;vertical-align:top;}
.item .sep{color:#F1FD0E;font-size:23px;padding:0 4px;}

/* ── Style B: BOX — compact card in the top-left corner, slides in from the
   left. No crawl, static text only. ── */
.hbox{position:absolute;display:flex;align-items:center;gap:13px;width:max-content;max-width:900px;overflow:hidden;
  background:#0A0A0A;border-radius:5px;padding:9px 18px 9px 13px;
  transform:translateX(-160%);transition:transform .75s cubic-bezier(.16,1,.3,1);}
.hbox.show{transform:translateX(0);}
.hmark{height:64px;width:auto;flex:0 0 auto;}                 /* Fanatics lockup (mark + wordmark) */
.htext{display:flex;flex-direction:column;justify-content:center;line-height:1;}
.bhead{font-family:'Sofia Sans Semi Condensed',sans-serif;font-weight:800;font-size:34px;
  letter-spacing:.4px;color:#F1FD0E;text-transform:uppercase;white-space:nowrap;}
.bmeta{font-family:'Sofia Sans Semi Condensed',sans-serif;font-weight:800;font-size:29px;
  letter-spacing:.4px;color:#FAFAFA;white-space:nowrap;margin-top:3px;}
.bmeta .sep{color:#F1FD0E;padding:0 6px;}
</style>
</head>
<body>
<div id="stage">
  <div id="bar" class="hbar">
    <img class="art" src="bar.png?v=4" alt=""/>
    <div class="hrwrap">
      <span class="hrhead">HOME RUN</span>
      <div class="hrvp"><div class="hrtrack"></div></div>
    </div>
  </div>
  <div id="box" class="hbox">
    <img class="hmark" src="fanatics_logo.png" alt=""/>
    <div class="htext">
      <div class="bhead">HOME RUN</div>
      <div class="bmeta"></div>
    </div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCKB90Xi33pxNw2zdS6XoUImpGmBfs9M5E",
  authDomain: "jm-odds-ticker.firebaseapp.com",
  databaseURL: "https://jm-odds-ticker-default-rtdb.firebaseio.com",
  projectId: "jm-odds-ticker",
  storageBucket: "jm-odds-ticker.firebasestorage.app",
  messagingSenderId: "1062781451132",
  appId: "1:1062781451132:web:74a6acbe270a719ef2c2f9"
};
firebase.initializeApp(FIREBASE_CONFIG);
const _db = firebase.database();
const fbKey = t => t.trim().replace(/[.#$\[\]\/\s]+/g,'-');

const HR_BUILD = '2026-09-25f-watch-all';
console.log('[HR banner] build ' + HR_BUILD);
const params = new URLSearchParams(location.search);
const TOPIC  = params.get('topic') || 'jomboy-hr';
// ?style=bar|box LOCKS this source to one style; without it, the source follows
// the Control toggle (pbp.style) live and defaults to bar.
const STYLE_LOCK = params.get('style') === 'box' ? 'box' : (params.get('style') === 'bar' ? 'bar' : null);
let curStyle = STYLE_LOCK || 'box';   // corner box is the default (top-bar reachable only via ?style=bar)
const DEMO   = params.get('demo') === '1';   // preview: fire a sample locally, no DB write
const SPEED  = 90;                            // bar crawl speed, px/s (matches moneyline)

// ── canvas layout: place the active banner, hide the other ──
const CANVAS_W = 1920, CANVAS_H = 1080, BAR_W = 864, BAR_H = 119, NUDGE_X = 52;
const stage = document.getElementById('stage');
const bar = document.getElementById('bar'), box = document.getElementById('box');
// Position both boxes once (only the active one is shown). Bar: fixed 864x119 at
// the top edge; box: top-left card.
bar.style.left = (params.has('x') ? parseFloat(params.get('x')) : (CANVAS_W - BAR_W) / 2 + NUDGE_X) + 'px';
bar.style.top  = (params.has('y') ? parseFloat(params.get('y')) : 5) + 'px';
box.style.left = (params.has('x') ? parseFloat(params.get('x')) : 8) + 'px';    // matches the reference photo
box.style.top  = (params.has('y') ? parseFloat(params.get('y')) : 36) + 'px';
if(params.has('w')) box.style.width = parseFloat(params.get('w')) + 'px';   // else hug content (CSS max-content)

// curStyle follows the Control toggle (pbp.style) live unless ?style= locks it.
function activeEl(){ return curStyle === 'box' ? box : bar; }
function applyStyle(s){
  curStyle = STYLE_LOCK || (s === 'box' ? 'box' : 'bar');
  bar.style.display = curStyle === 'bar' ? '' : 'none';
  box.style.display = curStyle === 'box' ? '' : 'none';
}
applyStyle(curStyle);

function fitStage(){
  const s = Math.min(innerWidth / CANVAS_W, innerHeight / CANVAS_H);
  const x = (innerWidth - CANVAS_W * s) / 2, y = (innerHeight - CANVAS_H * s) / 2;
  stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
}
addEventListener('resize', fitStage);
fitStage();

// ── spoiler delay: hold every pop-up this many seconds so the graphic can't
// beat the broadcast (stream runs behind the live data feed). Read live from the
// config node so the operator can tune it mid-show without a reload. ──
let spoiler = 0, holdSecs = 0, lastHideProcessed = 0, lastTestProcessed = 0, pbpFirst = true;
_db.ref('odds/' + fbKey(TOPIC) + '/pbp').on('value', s => {
  const v = s.val() || {};
  if(Number.isFinite(v.spoiler)) spoiler = Math.max(0, v.spoiler);
  // holdSecs 0 = auto (bar: measured from the crawl, box: 8s). >0 overrides both.
  holdSecs = Number.isFinite(v.holdSecs) ? Math.max(0, v.holdSecs) : 0;
  // live style switch from the Control toggle (ignored if ?style= locks this source)
  if(v.style && !STYLE_LOCK && v.style !== curStyle){ applyStyle(v.style); hide(); }
  // MLB API home-run detection: single picked game, or "watch all live games."
  // Same source as the scorebug, so scores/plays stay in sync. (Skipped in demo.)
  const ng = Number.isFinite(v.gamePk) ? v.gamePk : (v.gamePk ? parseInt(v.gamePk, 10) : null);
  const nOn = !!v.onair, nAll = !!v.allGames;
  if(!DEMO && (nAll !== mlbAll || ng !== gamePk || nOn !== mlbOn)){
    mlbAll = nAll; gamePk = ng; mlbOn = nOn;
    stopMLB(); stopMLBAll();
    if(mlbOn){ if(mlbAll) startMLBAll(); else if(gamePk) startMLB(); }
  }
  // On the first snapshot, adopt the existing command timestamps WITHOUT acting --
  // otherwise every page load / OBS scene activation would replay the last test or
  // hide. Only changes after load fire.
  if(pbpFirst){
    lastTestProcessed = Number.isFinite(v.testTs) ? v.testTs : 0;
    lastHideProcessed = Number.isFinite(v.hideTs) ? v.hideTs : 0;
    pbpFirst = false; return;
  }
  // manual "Hide now" from Control: a hideTs at/after the alert on screen clears it.
  if(Number.isFinite(v.hideTs) && v.hideTs > lastHideProcessed && v.hideTs >= lastAlertTs){
    lastHideProcessed = v.hideTs;
    clearTimeout(showTimer); clearTimeout(hideTimer); hide();
  }
  // "Test pop-up" from Control: fire a sample HR on the real overlay (OBS + tabs),
  // using the picked teams. Routed through pbp (operator-writable) so it needs no
  // admin write to the locked alert node.
  if(Number.isFinite(v.testTs) && v.testTs > lastTestProcessed){
    lastTestProcessed = v.testTs;
    const tm = (v.teams && v.teams.length === 2) ? v.teams : ['NYM', 'TEX'];
    schedule({ kind: 'HR', ts: Date.now(), headline: 'HOME RUN', label: '2-RUN',
      batter: 'Test Batter', team: tm[0], away: tm[0], home: tm[1], awayRuns: 3, homeRuns: 2, test: true });
  }
});

// ── MLB API: poll a game's live feed and fire on each new home run. statsapi
// is the same source the scorebug uses, so the score on the pop-up matches the
// scorebug. Dedup by atBatIndex; the first poll seeds history so earlier homers
// in the game don't all fire when you go on air. Shared by single-game mode and
// "watch all live games" mode (each game gets its own seen-set/seeded flag). ──
const RBI_LABEL = { 1: 'SOLO', 2: '2-RUN', 3: '3-RUN', 4: 'GRAND SLAM' };
async function pollGame(pk, seen, seededObj){
  try{
    const r = await fetch('https://statsapi.mlb.com/api/v1.1/game/' + pk + '/feed/live');
    const j = await r.json();
    const away = ((j.gameData||{}).teams||{}).away || {}, home = ((j.gameData||{}).teams||{}).home || {};
    const plays = (((j.liveData||{}).plays||{}).allPlays) || [];
    for(const p of plays){
      const res = p.result || {};
      if(res.eventType !== 'home_run') continue;
      const key = (p.atBatIndex != null) ? p.atBatIndex : ((p.about||{}).atBatIndex);
      if(key == null) continue;
      if(!seededObj.v){ seen.add(key); continue; }   // seed existing homers, don't fire
      if(seen.has(key)) continue;
      seen.add(key);
      const rbi = res.rbi || 1;
      const half = (p.about||{}).halfInning;           // 'top' = away batting
      schedule({ kind: 'HR', ts: Date.now(),
        headline: rbi >= 4 ? 'GRAND SLAM' : 'HOME RUN',
        label: RBI_LABEL[rbi] || (rbi + '-RUN'),
        batter: ((p.matchup||{}).batter||{}).fullName || '',
        team: half === 'top' ? away.abbreviation : home.abbreviation,
        away: away.abbreviation, home: home.abbreviation,
        awayRuns: res.awayScore, homeRuns: res.homeScore });
    }
    seededObj.v = true;
  }catch(e){}
}

// ── single-game mode ──
let gamePk = null, mlbOn = false, mlbTimer = null, mlbSeen = new Set(), mlbSeeded = { v: false };
function stopMLB(){ if(mlbTimer){ clearInterval(mlbTimer); mlbTimer = null; } }
function startMLB(){
  stopMLB(); mlbSeen = new Set(); mlbSeeded = { v: false };
  if(!gamePk) return;
  pollGame(gamePk, mlbSeen, mlbSeeded);
  mlbTimer = setInterval(() => pollGame(gamePk, mlbSeen, mlbSeeded), 12000);   // one game, ~12s cadence
}

// ── "watch all live games" mode: re-check today's schedule each cycle for
// which games are live, and poll every live game's feed. Each game tracked
// independently so joining a game mid-broadcast only seeds its OWN history. ──
let mlbAll = false, allTimer = null, allGamesMap = new Map();   // gamePk -> {seen:Set, seeded:{v}}
function stopMLBAll(){ if(allTimer){ clearInterval(allTimer); allTimer = null; } allGamesMap = new Map(); }
async function pollAllLive(){
  try{
    const d = new Date();
    const date = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const r = await fetch('https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=' + date);
    const j = await r.json();
    const games = (j.dates && j.dates[0] && j.dates[0].games) || [];
    const live = games.filter(g => (g.status||{}).abstractGameState === 'Live');
    for(const g of live){
      if(!allGamesMap.has(g.gamePk)) allGamesMap.set(g.gamePk, { seen: new Set(), seeded: { v: false } });
    }
    await Promise.all(live.map(g => {
      const entry = allGamesMap.get(g.gamePk);
      return pollGame(g.gamePk, entry.seen, entry.seeded);
    }));
  }catch(e){}
}
function startMLBAll(){
  stopMLBAll();
  pollAllLive();
  allTimer = setInterval(pollAllLive, 15000);   // re-checks the live slate each cycle
}

// ── the crawl engine for the bar style (one line, loops HR_LOOPS times) ──
const hrTrack = bar.querySelector('.hrtrack'), hrVp = bar.querySelector('.hrvp');
let hrItems = [];
const HR_LOOPS = 2;
function makeScroller(track, viewport, getItems, getSpeed){
  let offset = 0, rotPtr = 0, last = null;
  function spawn(){
    const list = getItems(); if(!list.length) return false;
    const m = list[rotPtr++ % list.length];
    const el = document.createElement('span'); el.className = 'item';
    el.innerHTML = '<span class="sep">&#9670;</span><span class="txt"></span>';
    el.querySelector('.txt').textContent = m.text || '';
    track.appendChild(el); return true;
  }
  function needSpawn(){
    const list = getItems(); if(!list.length) return false;
    const lastEl = track.lastChild; if(!lastEl) return true;
    return (lastEl.offsetLeft + lastEl.offsetWidth + offset) < viewport.clientWidth + 300;
  }
  function frame(t){
    if(last === null) last = t;
    const dt = Math.min((t - last)/1000, 0.05); last = t;
    if(track.firstChild) offset -= getSpeed() * dt; else offset = 0;
    while(track.firstChild){
      const c = track.firstChild;
      if(c.offsetLeft + c.offsetWidth + offset < -5){ offset += c.offsetWidth; track.removeChild(c); }
      else break;
    }
    let safety = 0;
    while(needSpawn() && safety++ < 50){ if(!spawn()) break; }
    track.style.transform = 'translateX(' + offset + 'px)';
    requestAnimationFrame(frame);
  }
  return {
    reset(){ offset = 0; rotPtr = 0; last = null; while(track.firstChild) track.removeChild(track.firstChild); },
    start(){ requestAnimationFrame(frame); },
  };
}
const hrscroll = makeScroller(hrTrack, hrVp, () => hrItems, () => SPEED);
hrscroll.start();   // harmless when the box style is active (no items to scroll)

function measureHR(line){
  const s = document.createElement('span'); s.className = 'item';
  s.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
  s.innerHTML = '<span class="sep">&#9670;</span><span class="txt"></span>';
  s.querySelector('.txt').textContent = line;
  bar.appendChild(s); const w = s.offsetWidth; bar.removeChild(s); return w;
}

// batter last name, uppercase, suffix stripped (e.g. "Bobby Witt Jr." -> "WITT")
function lastName(full){
  if(!full) return '';
  const parts = full.trim().split(/\s+/).filter(p => !/^(jr\.?|sr\.?|ii|iii|iv|v)$/i.test(p));
  return (parts[parts.length - 1] || full).toUpperCase();
}
// ── build the display line(s) from an alert payload ──
function lineFor(a){
  const score = a.away ? a.away + ' ' + a.awayRuns + ' - ' + a.home + ' ' + a.homeRuns : '';
  return [ (a.batter || '') + (a.team ? ' (' + a.team + ')' : ''), a.label, score ].filter(Boolean).join('   ');
}
function fill(a){
  const head = a.headline || 'HOME RUN';
  if(curStyle === 'bar'){
    bar.querySelector('.hrhead').textContent = head;
    hrItems = [{ text: lineFor(a) }]; hrscroll.reset();
  } else {
    // "HOME RUN (WITT)" over "KC 7 - 5 TEX" — matches the scorebug look.
    const ln = lastName(a.batter);
    box.querySelector('.bhead').textContent = head + (ln ? ' (' + ln + ')' : '');
    box.querySelector('.bmeta').textContent =
      a.away ? a.away + ' ' + a.awayRuns + ' - ' + a.homeRuns + ' ' + a.home : '';
  }
}
function durationFor(a){
  if(holdSecs > 0) return holdSecs;             // operator-set display time overrides
  if(curStyle === 'box') return 8;              // static card: fixed hold
  const line = lineFor(a);
  return Math.max(6, Math.min((HR_LOOPS * measureHR(line) + (hrVp.clientWidth || 500)) / SPEED, 30));
}

// ── show / hide ──
function show(){ activeEl().classList.add('show'); }
function hide(){
  bar.classList.remove('show'); box.classList.remove('show');   // clear both (safe across style switch)
  setTimeout(() => { hrItems = []; hrscroll.reset(); }, 750);   // matches the .75s slide-out
}

// ── alert scheduling with the spoiler delay ──
let lastAlertTs = 0, showTimer = null, hideTimer = null;
function fire(a, hold, elapsed){
  fill(a); show();
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hide, Math.max(500, (hold - (elapsed || 0)) * 1000));
}
function schedule(a){
  if(!a || !a.ts || a.ts <= lastAlertTs) return;   // ts-guard: no re-fire on reload/replay
  lastAlertTs = a.ts;
  clearTimeout(showTimer);
  if(a.clear){ clearTimeout(hideTimer); hide(); return; }   // manual take-down
  const hold = durationFor(a);
  const wait = a.test ? 0 : (a.ts + spoiler * 1000) - Date.now();   // test fires immediately
  if(wait <= -(hold * 1000)) return;                // whole window already elapsed (stale)
  if(wait > 0) showTimer = setTimeout(() => fire(a, hold, 0), wait);
  else fire(a, hold, -wait / 1000);
}
_db.ref('odds/' + fbKey(TOPIC) + '/alert').on('value', snap => schedule(snap.val()));

// Control's "Hide now" posts this so it also clears the banner in the preview.
addEventListener('message', e => {
  if(e && e.data === 'hrhide'){ clearTimeout(showTimer); clearTimeout(hideTimer); hide(); }
});

// ── preview/demo: fire a sample without touching Firebase (Control preview) ──
if(DEMO){
  const sample = {kind:'HR', headline:'HOME RUN', label:'2-RUN', batter:'Aaron Judge',
    team:'NYY', away:'TB', home:'NYY', awayRuns:2, homeRuns:4};
  const go = () => fire(sample, durationFor(sample), 0);
  setTimeout(go, 400);
  addEventListener('message', e => { if(e && e.data === 'hrdemo') go(); });
}
</script>
</body>
</html>
