<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Odds Ticker — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sofia+Sans+Semi+Condensed:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
body{font-family:'Sofia Sans Semi Condensed',sans-serif;}

/* Full 1920x1080 transparent canvas. Set the OBS Browser Source to your canvas
   size (1920x1080) -- the bar lands in position, no manual sizing. #stage scales
   to whatever the source/window actually is, so the Control preview and the OBS
   output are identical: same layout, just a different scale. */
#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;}

/* #barpos carries the bar's position and its size scale (?w=), so the bar itself
   stays a fixed 864x119 design and its px text never needs to change. 864x119 is
   the Singular on-air size (1920x264 art in a 45% box). */
#barpos{position:absolute;width:864px;height:119px;transform-origin:top left;}
#bar{position:absolute;inset:0;z-index:8;
  transform:translateY(0);transition:transform .45s cubic-bezier(.16,1,.3,1);}
#bar.hidden{transform:translateY(130%);}
#art{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* Text window = Singular Text Ticker box as % of the 864x119 bar (left 15.6%,
   width 81.8%, top 7.8%, height 69.9%). Font sizes are px at the 119px design
   (the old vh values x 1.19); #barpos/#stage scale everything uniformly. */
#viewport{position:absolute;left:15.6%;width:81.8%;top:7.8%;height:69.9%;overflow:hidden;}
#track{position:absolute;top:0;left:0;height:100%;white-space:nowrap;will-change:transform;}
.item{display:inline-flex;align-items:center;height:100%;
  font-family:'Sofia Sans Semi Condensed',sans-serif;font-weight:700;
  font-size:57px;letter-spacing:.4px;color:#FAFAFA;vertical-align:top;}
.item .q{font-weight:500;color:#F1FD0E;margin-right:2px;font-size:46px;letter-spacing:1px;}
.sep{color:#F1FD0E;font-size:23px;padding:0 4px;}

/* ⚡ Take Live: the soloed bet crawls in its own layer, same box as the ticker
   text, that POPS UP over the playlist crawl and slides away when cleared. The
   playlist is hidden (.dim) while it's up, so clearing reveals it still running
   -- or, if the playlist is off air, the whole bar slides away. */
#solo{position:absolute;left:15.6%;width:81.8%;top:7.8%;height:69.9%;overflow:hidden;
  transform:translateY(140%);transition:transform .5s cubic-bezier(.16,1,.3,1);}
#solo.on{transform:translateY(0);}
#solotrack{position:absolute;top:0;left:0;height:100%;white-space:nowrap;will-change:transform;}
#viewport.dim{visibility:hidden;}

</style>
</head>
<body>
<div id="stage">
  <div id="barpos">
    <div id="bar">
      <img id="art" src="bar.png?v=2" alt=""/>
      <div id="viewport"><div id="track"></div></div>
      <div id="solo"><div id="solotrack"></div></div>
    </div>
  </div>
</div>

<script>
// ── Firebase (shared house project) ──
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCKB90Xi33pxNw2zdS6XoUImpGmBfs9M5E",
  authDomain: "jm-odds-ticker.firebaseapp.com",
  databaseURL: "https://jm-odds-ticker-default-rtdb.firebaseio.com",
  projectId: "jm-odds-ticker",
  storageBucket: "jm-odds-ticker.firebasestorage.app",
  messagingSenderId: "1062781451132",
  appId: "1:1062781451132:web:74a6acbe270a719ef2c2f9"
};
firebase.initializeApp(FIREBASE_CONFIG);
const _db = firebase.database();
function fbKey(t){ return t.trim().replace(/[.#$\[\]\/\s]+/g,'-'); }

const params = new URLSearchParams(location.search);
const TOPIC  = params.get('topic') || 'jomboy-odds';
// ?bar= to point at different art without editing the file (sponsor swaps).
const BAR    = params.get('bar');
// ?preview=1 keeps the bar drawn even when off air, so the control page's
// preview shows the graphic instead of an empty box before you take it live.
// Never set this on the OBS source or the bar can't be taken off.
const PREVIEW = params.get('preview') === '1';

const bar  = document.getElementById('bar');
const viewport = document.getElementById('viewport');
const track = document.getElementById('track');
const stage = document.getElementById('stage');
const barpos = document.getElementById('barpos');
const soloEl = document.getElementById('solo');
const soloTrack = document.getElementById('solotrack');

if(BAR) document.getElementById('art').src = BAR;

// ── canvas layout ──
// Design canvas is 1920x1080. The bar is 864x119 (Singular on-air size); place
// and size it with ?x= ?y= ?w= (defaults: bottom-centre). The stage then scales
// to the actual OBS source / preview window, so both look identical.
const CANVAS_W = 1920, CANVAS_H = 1080, BAR_W = 864, BAR_H = 119;
const barW = parseFloat(params.get('w')) || BAR_W;
const barX = params.has('x') ? parseFloat(params.get('x')) : (CANVAS_W - barW) / 2;
const barY = params.has('y') ? parseFloat(params.get('y')) : (CANVAS_H - barW * BAR_H / BAR_W - 60);
barpos.style.left = barX + 'px';
barpos.style.top = barY + 'px';
barpos.style.transform = 'scale(' + (barW / BAR_W) + ')';

function fitStage(){
  const s = Math.min(innerWidth / CANVAS_W, innerHeight / CANVAS_H);
  const x = (innerWidth - CANVAS_W * s) / 2, y = (innerHeight - CANVAS_H * s) / 2;
  stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
}
addEventListener('resize', fitStage);
fitStage();

let items = [];      // rendered lines, [{id, text, q}]
let picked = [];     // the operator's selection, from /state
let live = {};       // id -> current line, from /markets
let soloId = null;   // ⚡ one id crawling in the solo layer over the playlist, or null
let soloItems = [];  // the solo layer's items ([the one bet] or [])
let wasVisible = false;
let speed = 90;
let lastTs = 0;

// RTDB hands arrays back as index-keyed objects often enough to bite.
const norm = x => !x ? [] : (Array.isArray(x) ? x : Object.values(x)).filter(Boolean);

// The Display joins the selection against the live feed itself rather than
// rendering whatever text the control page last published. That way the odds
// keep updating with the feeder even if the producer closes the control tab --
// otherwise the operator's browser is load-bearing for the whole show, and a
// closed tab means a bar quietly crawling stale prices with no tell.
// Published text is kept as the fallback for anything not in the current menu.
function recompute(){
  const next = picked.map(p => ({ id: p.id, q: p.q || '', text: live[p.id] || p.text || '' }))
                     .filter(i => i.text);
  // Only rebuild when the content actually changed -- reassigning on every
  // heartbeat would restart the crawl mid-line and read as a stutter.
  if(JSON.stringify(next.map(i => i.text)) === JSON.stringify(items.map(i => i.text))) return;
  items = next;
  playlist.resetRotation();
}

// ⚡ Take Live: the soloed bet crawls in its own layer that pops up over the
// playlist and slides away when cleared. The playlist keeps running underneath
// (hidden), so taking the solo down returns to it -- or, if the playlist is off
// air, the whole bar slides away. The bet may be soloed straight from the menu
// (not in the playlist), so its text comes from the live feed.
let soloHideTimer = null;
function applySolo(){
  const on = !!soloId;
  const p = picked.find(x => x.id === soloId);
  const text = on ? (live[soloId] || (p && p.text) || '') : '';
  const next = text ? [{ id: soloId, q: (p && p.q) || '', text }] : [];
  if(JSON.stringify(next.map(i => i.text)) !== JSON.stringify(soloItems.map(i => i.text))){
    soloItems = next; soloScroll.resetRotation();
  }
  clearTimeout(soloHideTimer);
  if(on){
    viewport.classList.add('dim');   // hide the playlist crawl behind the solo
    soloEl.classList.add('on');      // pop up
  } else {
    soloEl.classList.remove('on');   // slide away
    // keep the playlist hidden until the solo has fully slid off, so the two
    // never show through each other; then reveal the playlist crawl as-is.
    soloHideTimer = setTimeout(() => { if(!soloId) viewport.classList.remove('dim'); }, 520);
  }
}

function applyState(s){
  if(!s || typeof s !== 'object') return;
  if(!s.ts || s.ts <= lastTs) return;   // ignore replays of state we already have
  lastTs = s.ts;
  picked = norm(s.items);
  soloId = s.solo || null;
  if(Number.isFinite(s.speed)) speed = s.speed;

  const visible = !(s.visible === false && !PREVIEW);
  bar.classList.toggle('hidden', !visible);
  // Coming on air: restart the playlist crawl from the top so the operator's
  // first item is what viewers see first.
  if(visible && !wasVisible) playlist.reset();
  wasVisible = visible;

  recompute();
  applySolo();
}

function applyMenu(v){
  const mks = v && v.markets ? norm(v.markets) : [];
  live = Object.fromEntries(mks.map(m => [m.id, m.text]));
  recompute();
  applySolo();
}

// No connection indicator here on purpose: anything drawn in this page is
// inside the OBS source and composites onto the program feed. The control
// page carries the Firebase dot instead, where only the operator sees it.
_db.ref('odds/' + fbKey(TOPIC) + '/state').on('value', snap => applyState(snap.val()));
_db.ref('odds/' + fbKey(TOPIC) + '/markets').on('value', snap => applyMenu(snap.val()));

// ── seamless scroll engine: one instance per layer (playlist + solo) ──
function makeScroller(track, viewport, getItems){
  let offset = 0, rotPtr = 0, last = null;
  function spawn(){
    const list = getItems(); if(!list.length) return false;
    const m = list[rotPtr++ % list.length];
    const el = document.createElement('span'); el.className = 'item';
    el.innerHTML = `<span class="sep">◆</span><span class="q"></span><span class="txt"></span>`;
    // textContent, not innerHTML -- market titles are third-party strings.
    el.querySelector('.q').textContent = m.q || '';
    el.querySelector('.txt').textContent = m.text || '';
    track.appendChild(el); return true;
  }
  function needSpawn(){
    const list = getItems(); if(!list.length) return false;
    const lastEl = track.lastChild; if(!lastEl) return true;
    return (lastEl.offsetLeft + lastEl.offsetWidth + offset) < viewport.clientWidth + 300;
  }
  function frame(t){
    if(last === null) last = t;
    const dt = Math.min((t - last)/1000, 0.05); last = t;
    if(track.firstChild) offset -= speed * dt; else offset = 0;  // don't drift while empty
    while(track.firstChild){
      const c = track.firstChild;
      if(c.offsetLeft + c.offsetWidth + offset < -5){ offset += c.offsetWidth; track.removeChild(c); }
      else break;
    }
    let safety = 0;
    while(needSpawn() && safety++ < 50){ if(!spawn()) break; }
    track.style.transform = `translateX(${offset}px)`;
    requestAnimationFrame(frame);
  }
  return {
    resetRotation(){ rotPtr = 0; },   // next spawn starts at item 0, existing scroll out
    reset(){ offset = 0; rotPtr = 0; last = null; while(track.firstChild) track.removeChild(track.firstChild); },
    start(){ requestAnimationFrame(frame); },
  };
}
const playlist = makeScroller(track, viewport, () => items);
const soloScroll = makeScroller(soloTrack, soloEl, () => soloItems);
playlist.start();
soloScroll.start();
</script>
</body>
</html>
